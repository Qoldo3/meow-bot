<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>بازی حکم</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="team team-a" id="teamA">
        <div class="team-score" id="teamAScore">0</div>
        <div class="team-name" id="teamAName">تیم ۱</div>
      </div>
      <div class="center-info">
        <div class="trump" id="trump">—</div>
        <div class="hand-label" id="handLabel"></div>
        <div class="pot" id="pot"></div>
      </div>
      <div class="team team-b" id="teamB">
        <div class="team-score" id="teamBScore">0</div>
        <div class="team-name" id="teamBName">تیم ۲</div>
      </div>
    </header>

    <div id="message" class="notice hidden"></div>

    <div id="opponents">
      <div class="player-chip" id="opp1"></div>
      <div class="player-chip" id="opp2"></div>
    </div>

    <div id="table">
      <div id="revealArea" class="hidden"></div>
      <div id="trickArea">
        <div class="trick-slot" id="slot0"></div>
        <div class="trick-slot" id="slot1"></div>
        <div class="trick-slot" id="slot2"></div>
        <div class="trick-slot" id="slot3"></div>
      </div>
    </div>

    <div id="statusLine"></div>

    <div id="handArea">
      <div id="hand"></div>
    </div>

    <div id="controls">
      <button id="playBtn" class="hidden">بازی</button>
    </div>
  </div>

  <div id="modal" class="hidden">
    <div class="modal-box">
      <div id="modalTitle"></div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="app.js"></script>
</body>
</html>
